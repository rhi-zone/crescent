<title>Kernel candidates — LLM abstract-eval traces</title>
<meta charset="utf-8" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0e1116;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --proved: #3fb950;
    --refuted: #f85149;
    --open: #d29922;
    --flagged: #db6d28;
    --halt: #f778ba;
    --determined: #3fb950;
    --underdetermined: #d29922;
    --unsure: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 1.5rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.2rem; margin: 0 0 0.25rem 0; }
  h2 { font-size: 1rem; margin: 0 0 0.6rem 0; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .control { display: flex; flex-direction: column; gap: 0.3rem; }
  .control label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  select {
    background: #0d1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    font-size: 0.9rem;
    min-width: 22rem;
  }

  .citation { font-size: 0.8rem; color: var(--muted); max-width: 60rem; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .badge.v-proved { background: rgba(63,185,80,0.15); color: var(--proved); border-color: var(--proved); }
  .badge.v-refuted { background: rgba(248,81,73,0.15); color: var(--refuted); border-color: var(--refuted); }
  .badge.v-open { background: rgba(210,153,34,0.15); color: var(--open); border-color: var(--open); }
  .badge.v-flagged { background: rgba(219,109,40,0.15); color: var(--flagged); border-color: var(--flagged); }
  .badge.v-halt { background: rgba(247,120,186,0.15); color: var(--halt); border-color: var(--halt); }
  .badge.v-none { background: rgba(139,148,158,0.15); color: var(--muted); border-color: var(--muted); }

  .conf-badge { font-weight: 700; }
  .conf-badge.c-determined { background: rgba(63,185,80,0.15); color: var(--determined); border-color: var(--determined); }
  .conf-badge.c-underdetermined { background: rgba(210,153,34,0.15); color: var(--underdetermined); border-color: var(--underdetermined); }
  .conf-badge.c-unsure { background: rgba(248,81,73,0.15); color: var(--unsure); border-color: var(--unsure); }
  .conf-badge.c-none { background: rgba(139,148,158,0.15); color: var(--muted); border-color: var(--muted); }
  .conf-icon { font-size: 0.9em; }

  .prov-badge {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    border: 1px solid var(--muted);
    color: var(--muted);
    margin-left: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .prov-badge.prov-llm { border-color: var(--accent); color: var(--accent); }

  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; margin-bottom: 0.5rem; }
  th, td { border: 1px solid var(--border); padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; }

  .split { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
  .split > .col-main { flex: 1 1 30rem; min-width: 22rem; }
  .split > .col-source { flex: 1 1 26rem; min-width: 20rem; position: sticky; top: 1rem; max-height: 92vh; overflow-y: auto; }

  .steps-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .step-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.7rem 0.8rem;
    background: #0d1117;
  }
  .step-card.hl-hover { outline: 1px solid var(--accent); }
  .step-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
  .step-no { font-weight: 700; font-size: 0.85rem; }
  .step-desc { font-size: 0.9rem; white-space: pre-wrap; margin-bottom: 0.5rem; }

  .state-table td { font-size: 0.8rem; }
  .state-table .state-key { color: var(--muted); width: 10rem; white-space: nowrap; }
  .state-table .state-val pre { max-height: 10rem; overflow: auto; }

  .code-spans { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
  .span-chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.7rem;
    color: var(--muted);
    background: rgba(139,148,158,0.1);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }
  .span-chip.live { color: var(--accent); border-color: var(--accent); background: rgba(88,166,255,0.1); }

  .source-block { margin-bottom: 0.9rem; }
  .source-block .source-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.3rem; }
  .source-file {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8rem;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow-x: auto;
  }
  .source-line { display: flex; white-space: pre; padding: 0.05rem 0.4rem; cursor: default; }
  .source-line .ln { color: var(--muted); text-align: right; width: 2.6rem; flex: none; padding-right: 0.6rem; user-select: none; }
  .source-line .code { flex: 1 1 auto; }
  .source-line.hl-hover { background: rgba(88,166,255,0.18); }
  .source-line .step-refs { color: var(--accent); font-size: 0.72rem; margin-left: 0.6rem; flex: none; }

  .verdict-table .verdict-note { font-size: 0.78rem; color: var(--muted); }
  .summary-table td, .summary-table th { text-align: center; }
  .summary-table td:first-child, .summary-table th:first-child { text-align: left; }
</style>

<h1>Kernel candidates — LLM abstract-eval traces</h1>

<div class="controls">
  <div class="control">
    <label for="design-select">Design</label>
    <select id="design-select"></select>
  </div>
  <div class="control">
    <label for="scenario-select">Scenario</label>
    <select id="scenario-select"></select>
  </div>
</div>

<div class="panel">
  <span class="citation" id="scenario-citation"></span><span id="scenario-provenance"></span><span id="trace-provenance"></span>
</div>

<div class="split">
  <div class="col-main panel">
    <h2>Steps</h2>
    <div class="steps-list" id="steps-list"></div>
  </div>
  <div class="col-source panel">
    <h2>Source</h2>
    <div id="source-pane"></div>
  </div>
</div>

<div class="panel">
  <h2>Verdicts — all designs, current scenario</h2>
  <div id="verdict-row"></div>
</div>

<div class="panel">
  <h2>Determinacy summary — across all scenarios</h2>
  <div id="summary-table"></div>
</div>

<!-- Classic (non-module) scripts on purpose: file:// blocks fetch() of
     local JSON and can restrict type="module". Traces are pre-baked into
     .trace.js files that assign onto window.TRACES; scenarios.js/
     producers.js are the same real-source/reference data as before. No
     engine files: this page executes no evaluation logic, only renders. -->
<script src="scenarios.js"></script>
<script src="producers.js"></script>
<script src="traces/subtract.trace.js"></script>
<script src="traces/primitive.trace.js"></script>
<script src="traces/invert.trace.js"></script>
<script src="traces/evidence.trace.js"></script>
<script src="traces/saturation-a.trace.js"></script>
<script src="traces/saturation-b.trace.js"></script>
<script src="traces/synthesis.trace.js"></script>
<script src="app.js"></script>
