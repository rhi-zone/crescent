name: Build vendored binaries

on:
  workflow_dispatch: {}
  push:
    paths:
      - "dep/sqlite3/**"
      - "dep/zlib/**"
      - "dep/wepoll/**"
      - "dep/libressl/**"
      - "dep/luajit/**"
      - "dep/tcc/**"

jobs:
  # ── Version pinning + content-hash verification ─────────────────────────────
  # dep/X/VERSION is the pin: the version this workflow should build. Compared
  # against dep/X/VENDORED_VERSION, the marker the commit job writes alongside
  # the binaries it commits, recording what's currently vendored. When they
  # match, the corresponding build jobs below skip their (expensive)
  # build+upload steps entirely.
  #
  # VERSION alone only proves someone typed the right version string — it
  # does not prove the committed dep/X source tree still matches that version
  # byte-for-byte. dep/X/SOURCE_SHA256 (tooling/scripts/vendor-verify.sh)
  # closes that gap: a manifest hash over each dep's pinned source files,
  # checked here on every run. A mismatch fails this job hard, which in turn
  # blocks every build job below via `needs: version-check` — a source-tree
  # edit that silently drifts from what's supposedly pinned can't reach a
  # build or a commit undetected.

  version-check:
    runs-on: ubuntu-latest
    outputs:
      sqlite3_skip: ${{ steps.check.outputs.sqlite3_skip }}
      zlib_skip: ${{ steps.check.outputs.zlib_skip }}
      libressl_skip: ${{ steps.check.outputs.libressl_skip }}
      luajit_skip: ${{ steps.check.outputs.luajit_skip }}
      wepoll_skip: ${{ steps.check.outputs.wepoll_skip }}
      tcc_skip: ${{ steps.check.outputs.tcc_skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored source content hashes
        run: tooling/scripts/vendor-verify.sh verify sqlite3 zlib libressl wepoll luajit tcc
      - name: Compare pinned VERSION to vendored VERSION per dep
        id: check
        run: |
          check_dep() {
            dep="$1"
            pinned="$(cat "dep/$dep/VERSION" 2>/dev/null || true)"
            vendored="$(cat "dep/$dep/VENDORED_VERSION" 2>/dev/null || true)"
            if [ -n "$pinned" ] && [ "$pinned" = "$vendored" ]; then
              echo "Skipping $dep: pinned VERSION ($pinned) already vendored"
              echo "${dep}_skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Building $dep: pinned VERSION ($pinned) != vendored ($vendored)"
              echo "${dep}_skip=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_dep sqlite3
          check_dep zlib
          check_dep libressl
          check_dep luajit
          check_dep wepoll
          check_dep tcc

  # ── LuaJIT ────────────────────────────────────────────────────────────────

  luajit-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        # Built from the vendored dep/luajit/ source tree (no upstream
        # fetch): dep/luajit/VERSION pins the commit that source was
        # vendored from, and version-check verified its content hash.
        run: |
          make -C dep/luajit/src \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            LDFLAGS="-Wl,-E -static-libgcc"
          strip --strip-debug dep/luajit/src/luajit
          mkdir -p out
          cp dep/luajit/src/luajit out/luajit
          cp /lib/ld-musl-x86_64.so.1 out/ld-musl-x86_64.so.1
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-x86_64
          path: out/
          retention-days: 1

  luajit-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            make -C dep/luajit/src XCFLAGS='-DLUAJIT_ENABLE_GC64' LDFLAGS='-Wl,-E -static-libgcc' &&
            strip --strip-debug dep/luajit/src/luajit &&
            mkdir -p /work/out &&
            cp dep/luajit/src/luajit /work/out/luajit-aarch64 &&
            cp /lib/ld-musl-aarch64.so.1 /work/out/ld-musl-aarch64.so.1
          "
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-aarch64
          path: out/
          retention-days: 1

  luajit-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make -C dep/luajit/src \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            LDFLAGS="-Wl,-export_dynamic"
          strip dep/luajit/src/luajit
          mkdir -p out
          cp dep/luajit/src/luajit out/luajit-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-macos-arm64
          path: out/
          retention-days: 1

  luajit-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cd /d "%GITHUB_WORKSPACE%\dep\luajit\src"
          msvcbuild.bat
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "dep\luajit\src\luajit.exe" "out\luajit.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86_64
          path: out/
          retention-days: 1

  luajit-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          cd /d "%GITHUB_WORKSPACE%\dep\luajit\src"
          msvcbuild.bat
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "dep\luajit\src\luajit.exe" "out\luajit32.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86
          path: out/
          retention-days: 1

  # ── sqlite3 ───────────────────────────────────────────────────────────────

  sqlite3-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        run: |
          mkdir -p out
          gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o out/libsqlite3-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-linux-x86_64
          path: out/
          retention-days: 1

  sqlite3-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            mkdir -p /work/out &&
            gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o /work/out/libsqlite3-linux-aarch64.so
          "
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-linux-aarch64
          path: out/
          retention-days: 1

  sqlite3-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          clang -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o out/libsqlite3-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-macos-arm64
          path: out/
          retention-days: 1

  sqlite3-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD /DSQLITE_ENABLE_FTS5 dep\sqlite3\sqlite3.c /Fe:out\sqlite.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-windows-x86_64
          path: out/
          retention-days: 1

  sqlite3-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD dep\sqlite3\sqlite3.c /Fe:out\sqlite-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-windows-x86
          path: out/
          retention-days: 1

  # ── zlib ──────────────────────────────────────────────────────────────────

  zlib-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        run: |
          mkdir -p out
          gcc -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o out/libz-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-x86_64
          path: out/
          retention-days: 1

  zlib-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            mkdir -p /work/out &&
            gcc -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o /work/out/libz-linux-aarch64.so
          "
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-aarch64
          path: out/
          retention-days: 1

  zlib-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          clang -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o out/libz-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-macos-arm64
          path: out/
          retention-days: 1

  zlib-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD dep\zlib\adler32.c dep\zlib\compress.c dep\zlib\crc32.c dep\zlib\deflate.c dep\zlib\gzclose.c dep\zlib\gzlib.c dep\zlib\gzread.c dep\zlib\gzwrite.c dep\zlib\infback.c dep\zlib\inffast.c dep\zlib\inflate.c dep\zlib\inftrees.c dep\zlib\trees.c dep\zlib\uncompr.c dep\zlib\zutil.c /Fe:out\zlib.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-windows-x86_64
          path: out/
          retention-days: 1

  zlib-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD dep\zlib\adler32.c dep\zlib\compress.c dep\zlib\crc32.c dep\zlib\deflate.c dep\zlib\gzclose.c dep\zlib\gzlib.c dep\zlib\gzread.c dep\zlib\gzwrite.c dep\zlib\infback.c dep\zlib\inffast.c dep\zlib\inflate.c dep\zlib\inftrees.c dep\zlib\trees.c dep\zlib\uncompr.c dep\zlib\zutil.c /Fe:out\zlib-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-windows-x86
          path: out/
          retention-days: 1

  # ── libressl (libtls/libssl/libcrypto) ─────────────────────────────────────

  libressl-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.libressl_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base perl patchelf
      - name: Build
        run: |
          cp -rp dep/libressl /tmp/build-libressl
          cd /tmp/build-libressl
          LDFLAGS='-Wl,-rpath,\$$ORIGIN' ./configure --disable-tests
          make -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE"/out
          cp crypto/.libs/libcrypto.so.*.* "$GITHUB_WORKSPACE"/out/libcrypto.so.57
          cp ssl/.libs/libssl.so.*.*       "$GITHUB_WORKSPACE"/out/libssl.so.60
          cp tls/.libs/libtls.so.*.*       "$GITHUB_WORKSPACE"/out/libtls.so.33
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libcrypto.so.57
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libssl.so.60
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libtls.so.33
          # Note: the unversioned .so symlinks (libtls.so -> libtls.so.33, etc.)
          # are created by the commit job, not uploaded as artifacts here —
          # actions/upload-artifact's zip packaging is not relied on to
          # round-trip symlinks correctly.
      - uses: actions/upload-artifact@v4
        with:
          name: libressl-linux-x86_64
          path: out/
          retention-days: 1

  # ── wepoll ────────────────────────────────────────────────────────────────

  wepoll-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.wepoll_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD /DWEPOLL_EXPORT=__declspec(dllexport) dep\wepoll\wepoll.c /Fe:out\wepoll-x64.dll /link ws2_32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: wepoll-windows-x86_64
          path: out/
          retention-days: 1

  wepoll-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.wepoll_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD /DWEPOLL_EXPORT=__declspec(dllexport) dep\wepoll\wepoll.c /Fe:out\wepoll-x86.dll /link ws2_32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: wepoll-windows-x86
          path: out/
          retention-days: 1

  # ── TinyCC (tcc) — C-compiler fallback tier ────────────────────────────────
  #
  # tcc is infrastructure, not one of the 5 native-code tiers itself (see
  # docs/native-tiers.md "TinyCC: enabling tier 4, not a tier"): it exists so
  # tier 4 "C build" has a compiler to fall back on when a platform/CI runner
  # lacks a system C compiler. Source is vendored as-is in dep/tcc/ (mob
  # branch, pinned via dep/tcc/VERSION to a commit SHA — mob is untagged and
  # rolling, so a SHA pin is used the same way as luajit's). These jobs build
  # the tcc compiler itself from that source, same skip-if-unchanged and
  # commit-in-lockstep treatment as every other dep above (2026-08-21: tcc
  # used to be dispatch-only and separated into its own workflow file after
  # a shared version-check step let a tcc hash mismatch block unrelated
  # dep builds — the shared-step bug is fixed by giving each dep its own
  # `check_dep` skip output rather than by keeping tcc split out).
  #
  # A separate diagnostic job used to exist here (tcc-build-deps-linux-x86_64:
  # using the freshly built tcc to compile sqlite3/zlib/luajit/libressl as a
  # self-hosting smoke test) — removed 2026-08-21: it never produced a
  # committed artifact (tcc-compiled binaries are less optimized than the
  # gcc/clang-built ones above and were never meant to ship), and its
  # findings (sqlite3 needs an explicit -lm; zlib builds clean; luajit is
  # blocked on lj_def.h having no __TINYC__ branch; libressl needed
  # --disable-asm) are already on record in TODO.md. The three assembler gaps
  # behind that last one are now closed -- `0010` (xmm8-xmm15), `0011`
  # (movaps/movups/movhps operand types) and `0012` (the `.value` directive) --
  # and all seven of libressl's `*-elf-x86_64.S` files assemble with the
  # patched tcc. libressl now also configures, builds, links and passes its
  # own `make check` end to end with tcc as CC -- verified by hand, see
  # TODO.md -- but only via `CC=<tcc> LD=<tcc> ./configure --disable-asm`
  # with `dep/libressl/patches/*.patch` applied first. Setting LD is
  # required, not optional: it is what keeps libtool off the with_gnu_ld
  # path, whose anonymous version script tcc cannot link. Nothing in CI runs
  # that build today; whether it should is an open owner call recorded in
  # TODO.md. Re-run it by hand if tcc's viability as an actual
  # build compiler (not just a fallback binary) needs re-checking later.

  tcc-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.tcc_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        # git is required here (not just build-base): the "Apply
        # dep/tcc/patches" step below runs `git apply` inside this same
        # alpine:latest container, and alpine's base image has no git
        # binary until installed explicitly. Confirmed broken in run
        # 32453775057 (2026-08-21): "git: not found", exit 127, before any
        # patch content was even read -- unrelated to patch correctness.
        # bash is required here (not just build-base/git): three of the
        # dep/tcc/patches/*-tests/run.sh harnesses (0014, 0018, 0019) use
        # bash-only redirection (herestrings, `<<<`) that busybox sh's
        # `sh -n` rejects with "syntax error: unexpected redirection". The
        # other 18 harnesses parse and run fine under busybox sh, but all
        # 21 are invoked via their `#!/usr/bin/env bash` shebang below, so
        # bash has to be on PATH for any of them, not just the three.
        run: apk add --no-cache build-base git bash
      - name: Apply dep/tcc/patches (assembler/opcode-table fixes; see dep/tcc/patches/ and docs/native-tiers.md)
        run: git apply dep/tcc/patches/0001-plt-suffix.patch dep/tcc/patches/0002-libressl-sse-aesni-opcodes.patch dep/tcc/patches/0003-asm-forward-label-diff-and-leb128.patch dep/tcc/patches/0004-asm-section-flags-alloc.patch dep/tcc/patches/0005-asm-leb128-relaxation.patch dep/tcc/patches/0006-dwarf-section-flag-and-debug-retention.patch dep/tcc/patches/0007-reserved-section-gate-and-eh-frame-retention.patch dep/tcc/patches/0008-pt-gnu-stack.patch dep/tcc/patches/0009-reserved-section-input-side-gate.patch dep/tcc/patches/0010-extended-sse-registers.patch dep/tcc/patches/0011-sse-mov-operand-types.patch dep/tcc/patches/0012-asm-value-directive.patch dep/tcc/patches/0013-asm-macro-body-dollar-lexing.patch dep/tcc/patches/0014-note-gnu-stack-object-marker.patch dep/tcc/patches/0015-adx-bmi2-opcodes.patch dep/tcc/patches/0016-asm-rept-replay-double-capture.patch dep/tcc/patches/0017-asm-macro-and-conditional-directives.patch dep/tcc/patches/0018-elf-target-predefine.patch dep/tcc/patches/0019-note-gnu-stack-merge-raise.patch dep/tcc/patches/0020-tinyc-version-predefine.patch dep/tcc/patches/0021-asm-section-name-attrs.patch dep/tcc/patches/0022-asm-section-type.patch dep/tcc/patches/0023-run-unplaced-section-relocs.patch dep/tcc/patches/0024-asm-nobits-content.patch dep/tcc/patches/0025-asm-zero-directive.patch dep/tcc/patches/0026-i386-sse-mov-operand-types.patch dep/tcc/patches/0027-asm-nobase-sib-operand.patch
      - name: Build (built with the container's own gcc, per dep/tcc/README's documented ./configure && make)
        # --config-musl is required here, not optional: this container is
        # Alpine (musl libc). Without it, tcc's own configure defaults to
        # the glibc-assuming branch, which leaves lib/bcheck.c's HAVE_CTYPE
        # gated on `#if defined CONFIG_TCC_MUSL` never firing -- bcheck.c
        # then calls the glibc-only __ctype_b_loc()/__ctype_tolower_loc(),
        # which musl does not provide, and `make` fails building
        # lib/libtcc1.a with "error: pointer expected" (implicit declaration
        # of __ctype_b_loc). Found and confirmed locally: `./configure`
        # (no flag) reproduces this failure verbatim in this exact
        # alpine:latest container; `./configure --config-musl` builds
        # clean end to end. See TODO.md for the full repro.
        run: |
          cd dep/tcc
          ./configure --config-musl
          make -j"$(nproc)"
      - name: Test (tcc's own suite, which the patch stack made passable)
        # tcc's own `make test` -- test1/test3 included -- could not complete
        # on this stack until `0020` and `0021` landed together: `0020` was
        # the __TINYC__ blocker, `0021` the `relocation '2' out of range` one.
        # It has been green since, so it is a gate now rather than a known
        # failure, and it gates the artifact by running before the copy below.
        # ~5s in this container, so it costs nothing to keep.
        #
        # No --config-bcheck=no needed, contrary to what TODO.md said before
        # this was measured: --config-musl is what makes lib/bcheck.c compile
        # against musl (the CONFIG_TCC_MUSL HAVE_CTYPE gate), and the build
        # step above already passes it, so memtest/btest run like the rest.
        run: |
          cd dep/tcc
          make test
      - name: Test (per-patch harnesses in dep/tcc/patches/*-tests/)
        # Each harness verifies its own patch's specific fix against real
        # GNU as/readelf/objdump output (see dep/tcc/patches/*-tests/README.md).
        # Every run.sh takes the built tcc binary as $1 and exits non-zero
        # if any of its checks fail ("[ \"$fail\" -eq 0 ]" as the last line),
        # so this loop gates the job the same way `make test` above does.
        run: |
          cd dep/tcc
          status=0
          for d in patches/*-tests; do
            echo "::group::${d}"
            if bash "$d/run.sh" "$PWD/tcc"; then
              echo "PASS: $d"
            else
              echo "FAIL: $d"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Package
        run: |
          cd dep/tcc
          strip --strip-debug tcc
          mkdir -p "$GITHUB_WORKSPACE"/out
          cp tcc "$GITHUB_WORKSPACE"/out/tcc-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-linux-x86_64
          path: out/
          retention-days: 1

