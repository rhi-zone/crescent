name: Build vendored binaries

on:
  workflow_dispatch: {}
  push:
    paths:
      - "dep/sqlite3/**"
      - "dep/zlib/**"
      - "dep/wepoll/**"
      - "dep/libressl/**"
      - "dep/luajit/**"

jobs:
  # ── Version pinning + content-hash verification ─────────────────────────────
  # dep/X/VERSION is the pin: the version this workflow should build. Compared
  # against dep/X/VENDORED_VERSION, the marker the commit job writes alongside
  # the binaries it commits, recording what's currently vendored. When they
  # match, the corresponding build jobs below skip their (expensive)
  # build+upload steps entirely.
  #
  # VERSION alone only proves someone typed the right version string — it
  # does not prove the committed dep/X source tree still matches that version
  # byte-for-byte. dep/X/SOURCE_SHA256 (tooling/scripts/vendor-verify.sh)
  # closes that gap: a manifest hash over each dep's pinned source files,
  # checked here on every run. A mismatch fails this job hard, which in turn
  # blocks every build job below via `needs: version-check` — a source-tree
  # edit that silently drifts from what's supposedly pinned can't reach a
  # build or a commit undetected.

  version-check:
    runs-on: ubuntu-latest
    outputs:
      sqlite3_skip: ${{ steps.check.outputs.sqlite3_skip }}
      zlib_skip: ${{ steps.check.outputs.zlib_skip }}
      libressl_skip: ${{ steps.check.outputs.libressl_skip }}
      luajit_skip: ${{ steps.check.outputs.luajit_skip }}
      wepoll_skip: ${{ steps.check.outputs.wepoll_skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored source content hashes
        run: tooling/scripts/vendor-verify.sh verify sqlite3 zlib libressl wepoll tcc luajit
      - name: Compare pinned VERSION to vendored VERSION per dep
        id: check
        run: |
          check_dep() {
            dep="$1"
            pinned="$(cat "dep/$dep/VERSION" 2>/dev/null || true)"
            vendored="$(cat "dep/$dep/VENDORED_VERSION" 2>/dev/null || true)"
            if [ -n "$pinned" ] && [ "$pinned" = "$vendored" ]; then
              echo "Skipping $dep: pinned VERSION ($pinned) already vendored"
              echo "${dep}_skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Building $dep: pinned VERSION ($pinned) != vendored ($vendored)"
              echo "${dep}_skip=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_dep sqlite3
          check_dep zlib
          check_dep libressl
          check_dep luajit
          check_dep wepoll

  # ── LuaJIT ────────────────────────────────────────────────────────────────

  luajit-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        # Built from the vendored dep/luajit/ source tree (no upstream
        # fetch): dep/luajit/VERSION pins the commit that source was
        # vendored from, and version-check verified its content hash.
        run: |
          make -C dep/luajit/src \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            LDFLAGS="-Wl,-E -static-libgcc"
          strip --strip-debug dep/luajit/src/luajit
          mkdir -p out
          cp dep/luajit/src/luajit out/luajit
          cp /lib/ld-musl-x86_64.so.1 out/ld-musl-x86_64.so.1
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-x86_64
          path: out/
          retention-days: 1

  luajit-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            make -C dep/luajit/src XCFLAGS='-DLUAJIT_ENABLE_GC64' LDFLAGS='-Wl,-E -static-libgcc' &&
            strip --strip-debug dep/luajit/src/luajit &&
            mkdir -p /work/out &&
            cp dep/luajit/src/luajit /work/out/luajit-aarch64 &&
            cp /lib/ld-musl-aarch64.so.1 /work/out/ld-musl-aarch64.so.1
          "
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-aarch64
          path: out/
          retention-days: 1

  luajit-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make -C dep/luajit/src \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            LDFLAGS="-Wl,-export_dynamic"
          strip dep/luajit/src/luajit
          mkdir -p out
          cp dep/luajit/src/luajit out/luajit-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-macos-arm64
          path: out/
          retention-days: 1

  luajit-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cd /d "%GITHUB_WORKSPACE%\dep\luajit\src"
          msvcbuild.bat
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "dep\luajit\src\luajit.exe" "out\luajit.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86_64
          path: out/
          retention-days: 1

  luajit-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          cd /d "%GITHUB_WORKSPACE%\dep\luajit\src"
          msvcbuild.bat
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "dep\luajit\src\luajit.exe" "out\luajit32.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86
          path: out/
          retention-days: 1

  # ── sqlite3 ───────────────────────────────────────────────────────────────

  sqlite3-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        run: |
          mkdir -p out
          gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o out/libsqlite3-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-linux-x86_64
          path: out/
          retention-days: 1

  sqlite3-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            mkdir -p /work/out &&
            gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o /work/out/libsqlite3-linux-aarch64.so
          "
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-linux-aarch64
          path: out/
          retention-days: 1

  sqlite3-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          clang -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o out/libsqlite3-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-macos-arm64
          path: out/
          retention-days: 1

  sqlite3-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD /DSQLITE_ENABLE_FTS5 dep\sqlite3\sqlite3.c /Fe:out\sqlite.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-windows-x86_64
          path: out/
          retention-days: 1

  sqlite3-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD dep\sqlite3\sqlite3.c /Fe:out\sqlite-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-windows-x86
          path: out/
          retention-days: 1

  # ── zlib ──────────────────────────────────────────────────────────────────

  zlib-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        run: |
          mkdir -p out
          gcc -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o out/libz-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-x86_64
          path: out/
          retention-days: 1

  zlib-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            mkdir -p /work/out &&
            gcc -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o /work/out/libz-linux-aarch64.so
          "
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-aarch64
          path: out/
          retention-days: 1

  zlib-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          clang -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o out/libz-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-macos-arm64
          path: out/
          retention-days: 1

  zlib-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD dep\zlib\adler32.c dep\zlib\compress.c dep\zlib\crc32.c dep\zlib\deflate.c dep\zlib\gzclose.c dep\zlib\gzlib.c dep\zlib\gzread.c dep\zlib\gzwrite.c dep\zlib\infback.c dep\zlib\inffast.c dep\zlib\inflate.c dep\zlib\inftrees.c dep\zlib\trees.c dep\zlib\uncompr.c dep\zlib\zutil.c /Fe:out\zlib.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-windows-x86_64
          path: out/
          retention-days: 1

  zlib-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD dep\zlib\adler32.c dep\zlib\compress.c dep\zlib\crc32.c dep\zlib\deflate.c dep\zlib\gzclose.c dep\zlib\gzlib.c dep\zlib\gzread.c dep\zlib\gzwrite.c dep\zlib\infback.c dep\zlib\inffast.c dep\zlib\inflate.c dep\zlib\inftrees.c dep\zlib\trees.c dep\zlib\uncompr.c dep\zlib\zutil.c /Fe:out\zlib-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-windows-x86
          path: out/
          retention-days: 1

  # ── libressl (libtls/libssl/libcrypto) ─────────────────────────────────────

  libressl-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.libressl_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base perl patchelf
      - name: Build
        run: |
          cp -rp dep/libressl /tmp/build-libressl
          cd /tmp/build-libressl
          LDFLAGS='-Wl,-rpath,\$$ORIGIN' ./configure --disable-tests
          make -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE"/out
          cp crypto/.libs/libcrypto.so.*.* "$GITHUB_WORKSPACE"/out/libcrypto.so.57
          cp ssl/.libs/libssl.so.*.*       "$GITHUB_WORKSPACE"/out/libssl.so.60
          cp tls/.libs/libtls.so.*.*       "$GITHUB_WORKSPACE"/out/libtls.so.33
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libcrypto.so.57
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libssl.so.60
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libtls.so.33
          # Note: the unversioned .so symlinks (libtls.so -> libtls.so.33, etc.)
          # are created by the commit job, not uploaded as artifacts here —
          # actions/upload-artifact's zip packaging is not relied on to
          # round-trip symlinks correctly.
      - uses: actions/upload-artifact@v4
        with:
          name: libressl-linux-x86_64
          path: out/
          retention-days: 1

  # ── wepoll ────────────────────────────────────────────────────────────────

  wepoll-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.wepoll_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD /DWEPOLL_EXPORT=__declspec(dllexport) dep\wepoll\wepoll.c /Fe:out\wepoll-x64.dll /link ws2_32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: wepoll-windows-x86_64
          path: out/
          retention-days: 1

  wepoll-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.wepoll_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD /DWEPOLL_EXPORT=__declspec(dllexport) dep\wepoll\wepoll.c /Fe:out\wepoll-x86.dll /link ws2_32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: wepoll-windows-x86
          path: out/
          retention-days: 1

  # ── TinyCC (tcc) — C-compiler fallback tier ────────────────────────────────
  #
  # tcc is infrastructure, not one of the 5 native-code tiers itself (see
  # docs/native-tiers.md "TinyCC: enabling tier 4, not a tier"): it exists so
  # tier 4 "C build" has a compiler to fall back on when a platform/CI runner
  # lacks a system C compiler. Source is vendored as-is in dep/tcc/ (mob
  # branch, pinned via dep/tcc/VERSION to a commit SHA — mob is untagged and
  # rolling, so a SHA pin is used the same way as the luajit_ref default
  # above; see TODO.md for the bump reminder). dep/tcc does NOT participate
  # in the version-check skip machinery above: that machinery exists to skip
  # *rebuilding prebuilt binaries* on every push for deps with a push
  # trigger; tcc has no push trigger (dispatch-only, per the brief — this is
  # a dev-facing fallback tier, not default trigger surface) so there is
  # nothing to skip against.
  #
  # These jobs are gated to workflow_dispatch only and are never part of the
  # `commit` job's `needs:` graph below, so the push-triggered sqlite3/zlib/
  # wepoll/libressl jobs and their commit behavior are completely unaffected.

  tcc-bootstrap-linux-x86_64:
    needs: version-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Apply dep/tcc/patches (assembler/opcode-table fixes; see dep/tcc/patches/ and docs/native-tiers.md)
        run: git apply dep/tcc/patches/0001-plt-suffix.patch dep/tcc/patches/0002-libressl-sse-aesni-opcodes.patch dep/tcc/patches/0003-asm-forward-label-diff-and-leb128.patch dep/tcc/patches/0004-asm-section-flags-alloc.patch
      - name: Bootstrap tcc (built with the container's own gcc, per dep/tcc/README's documented ./configure && make)
        # --config-musl is required here, not optional: this container is
        # Alpine (musl libc). Without it, tcc's own configure defaults to
        # the glibc-assuming branch, which leaves lib/bcheck.c's HAVE_CTYPE
        # gated on `#if defined CONFIG_TCC_MUSL` never firing -- bcheck.c
        # then calls the glibc-only __ctype_b_loc()/__ctype_tolower_loc(),
        # which musl does not provide, and `make` fails building
        # lib/libtcc1.a with "error: pointer expected" (implicit declaration
        # of __ctype_b_loc). Found and confirmed locally: `./configure`
        # (no flag) reproduces this failure verbatim in this exact
        # alpine:latest container; `./configure --config-musl` builds
        # clean end to end. See TODO.md for the full repro.
        run: |
          cd dep/tcc
          ./configure --config-musl
          make -j"$(nproc)"
          strip --strip-debug tcc
          mkdir -p "$GITHUB_WORKSPACE"/out
          cp tcc "$GITHUB_WORKSPACE"/out/tcc-linux-x86_64
          cp libtcc1.a "$GITHUB_WORKSPACE"/out/libtcc1-linux-x86_64.a
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-linux-x86_64
          path: out/
          retention-days: 1

  tcc-bootstrap-linux-aarch64:
    needs: version-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Apply dep/tcc/patches (assembler/opcode-table fixes; see dep/tcc/patches/ and docs/native-tiers.md)
        run: git apply dep/tcc/patches/0001-plt-suffix.patch dep/tcc/patches/0002-libressl-sse-aesni-opcodes.patch dep/tcc/patches/0003-asm-forward-label-diff-and-leb128.patch dep/tcc/patches/0004-asm-section-flags-alloc.patch
      - name: Build (via Alpine Docker)
        # --config-musl required: same Alpine/musl HAVE_CTYPE gap as the
        # linux-x86_64 job above (see its comment for the full root cause).
        run: |
          docker run --rm -v "$PWD:/work" -w /work/dep/tcc alpine:latest sh -c "
            apk add --no-cache build-base &&
            ./configure --config-musl &&
            make -j\$(nproc) &&
            strip --strip-debug tcc &&
            mkdir -p /work/out &&
            cp tcc /work/out/tcc-linux-aarch64 &&
            cp libtcc1.a /work/out/libtcc1-linux-aarch64.a
          "
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-linux-aarch64
          path: out/
          retention-days: 1

  tcc-bootstrap-macos-arm64:
    needs: version-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Apply dep/tcc/patches (assembler/opcode-table fixes; see dep/tcc/patches/ and docs/native-tiers.md)
        run: git apply dep/tcc/patches/0001-plt-suffix.patch dep/tcc/patches/0002-libressl-sse-aesni-opcodes.patch dep/tcc/patches/0003-asm-forward-label-diff-and-leb128.patch dep/tcc/patches/0004-asm-section-flags-alloc.patch
      - name: Bootstrap tcc
        run: |
          cd dep/tcc
          ./configure
          make -j"$(sysctl -n hw.ncpu)"
          strip tcc
          mkdir -p "$GITHUB_WORKSPACE"/out
          cp tcc "$GITHUB_WORKSPACE"/out/tcc-macos-aarch64
          cp libtcc1.a "$GITHUB_WORKSPACE"/out/libtcc1-macos-aarch64.a
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-macos-arm64
          path: out/
          retention-days: 1

  tcc-bootstrap-windows-x86_64:
    needs: version-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Apply dep/tcc/patches (assembler/opcode-table fixes; see dep/tcc/patches/ and docs/native-tiers.md)
        run: git apply dep/tcc/patches/0001-plt-suffix.patch dep/tcc/patches/0002-libressl-sse-aesni-opcodes.patch dep/tcc/patches/0003-asm-forward-label-diff-and-leb128.patch dep/tcc/patches/0004-asm-section-flags-alloc.patch
      - name: Bootstrap tcc (win32/build-tcc.bat, per dep/tcc/win32/tcc-win32.txt build docs)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cd /d "%GITHUB_WORKSPACE%\dep\tcc\win32"
          build-tcc.bat -c cl
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "dep\tcc\win32\tcc.exe" "out\tcc-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-windows-x86_64
          path: out/
          retention-days: 1

  tcc-bootstrap-windows-x86:
    needs: version-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Apply dep/tcc/patches (assembler/opcode-table fixes; see dep/tcc/patches/ and docs/native-tiers.md)
        run: git apply dep/tcc/patches/0001-plt-suffix.patch dep/tcc/patches/0002-libressl-sse-aesni-opcodes.patch dep/tcc/patches/0003-asm-forward-label-diff-and-leb128.patch dep/tcc/patches/0004-asm-section-flags-alloc.patch
      - name: Bootstrap tcc (win32/build-tcc.bat, per dep/tcc/win32/tcc-win32.txt build docs)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          cd /d "%GITHUB_WORKSPACE%\dep\tcc\win32"
          build-tcc.bat -c cl
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "dep\tcc\win32\tcc.exe" "out\tcc-windows-x86.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-windows-x86
          path: out/
          retention-days: 1

  # Use the freshly bootstrapped tcc to build the other vendored deps.
  # Wired for linux-x86_64 only: that is the only combination exercised
  # locally so far (see TODO.md for the per-dep findings). Extending to
  # other platforms or deps is future work, not something to silently
  # generalize to here.
  #
  # Per-dep results found when actually building each with tcc
  # (mob@2ba12e83b3599ca8f5d50c179fe5138fe956f0c9), verified for real inside
  # an alpine:latest container (the same image this job runs in — not a
  # substitute host):
  #   - Bootstrapping tcc itself in this container REQUIRES
  #     `./configure --config-musl` (see the tcc-bootstrap-linux-x86_64 job's
  #     comment) and the "Prepare tcc" step below must place libtcc1.a
  #     directly at `tcc-bin/libtcc1.a`, NOT `tcc-bin/lib/libtcc1.a` — tcc's
  #     own `CONFIG_TCC_LIBPATHS` (`tcc.h`) resolves to `"{B}" ":" "/usr/lib"`
  #     for this target (no implicit `/lib` suffix under `-B`), so a
  #     `tcc-bin/lib/libtcc1.a` layout is silently never found and every
  #     link fails `tcc: error: file 'libtcc1.a' not found`. Both were found
  #     by actually reproducing this job's exact steps locally (Docker,
  #     alpine:latest) and hitting both failures verbatim before fixing them
  #     here; see TODO.md for the full repro transcripts.
  #   - sqlite3: builds cleanly (with both fixes above applied), needs an
  #     explicit -lm (tcc does not auto-link libm the way gcc/clang's driver
  #     does). Locally re-verified end to end after the two tcc fixes above.
  #   - zlib: builds cleanly, no extra flags needed. Locally re-verified.
  #   - luajit: wired below, but NOT currently buildable with this tcc —
  #     genuine substrate gap, not a wiring/script problem. `dep/tcc`
  #     defines only `__TINYC__`, never `__GNUC__`/`__clang__`, and provides
  #     none of the `__builtin_ctz`/`__builtin_clz`/`__builtin_ctzll`/
  #     `__builtin_clzll` builtins LuaJIT's `lj_def.h` requires; that header
  #     has exactly three branches (GCC/clang via `__GNUC__`/`__clang__`,
  #     MSVC via `_MSC_VER`, and a `_M_PPC`-only manual fallback) and falls
  #     through to `#error "missing defines for your compiler"` for
  #     anything else, including tcc. This was reached even before the
  #     `sym@PLT`/`lj_vm.S` assembler question (0001-plt-suffix.patch) could
  #     matter: `host/minilua` builds and runs fine under tcc (no GNUC
  #     dependency there), but `host/buildvm.o` — a host tool needed before
  #     any LuaJIT source, including `lj_vm.S`, gets built — fails to
  #     compile at `lj_def.h:322`. Fixing this needs either a `__TINYC__`
  #     branch added to LuaJIT's own `lj_def.h` (upstream LuaJIT change, not
  #     something to patch around here) or teaching tcc to define
  #     `__GNUC__`-compatible builtins (a much larger tcc change than either
  #     existing dep/tcc/patches/*.patch). Neither is attempted here per
  #     CLAUDE.md's no-special-casing/no-fake-success rule — this step is
  #     wired in for real (not commented out, not `continue-on-error`) so
  #     the job's failure here accurately reflects reality until the gap is
  #     closed upstream. See TODO.md for the exact command and error.
  #   - libressl: dep/tcc/patches/0002-libressl-sse-aesni-opcodes.patch
  #     (applied above) adds the SSE2/AES-NI opcode-table entries the
  #     vendored perlasm-generated *-elf-x86_64.S files need (movdqa/u,
  #     pshufd, shufps, xorps, pslldq/psrldq, paddq, pinsrw, and the full
  #     aesenc/aesdec/aesenclast/aesdeclast/aesimc/aeskeygenassist AES-NI
  #     family) — verified byte-identical to real GNU `as` output, and the
  #     patched tcc cleanly assembles dep/libressl/crypto/aes/aes-elf-x86_64.S,
  #     rc4/rc4-elf-x86_64.S, and bn/{modexp512,mont,mont5}-elf-x86_64.S.
  #     BUT: assembling aesni-elf-x86_64.S and modes/ghash-elf-x86_64.S
  #     surfaced a SEPARATE, previously-undiscovered gap — this vendored
  #     tcc has no xmm8-xmm15 (or r8-r15) register support at all, which
  #     those two files need and the opcode-table patch does not address.
  #     --disable-asm is therefore kept below; flipping it off would break
  #     this job. See TODO.md for the new register-support gap. The full
  #     `--disable-asm` configure+make path itself (distinct from the asm
  #     question) is still not locally re-verified after the tcc bootstrap
  #     fixes above — out of scope for this pass, which focused on luajit.
  tcc-build-deps-linux-x86_64:
    if: github.event_name == 'workflow_dispatch'
    needs: tcc-bootstrap-linux-x86_64
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tcc-linux-x86_64
          path: tcc-bin
      - name: Install build tools (tcc still needs perl/make for libressl's build, and glibc-less musl's own crt/headers are already present in this image)
        run: apk add --no-cache build-base perl
      - name: Prepare tcc
        # libtcc1.a goes directly at tcc-bin/libtcc1.a (NOT tcc-bin/lib/) —
        # see the job-level comment above for why a lib/ subdir is silently
        # never found by tcc's own library search path under -B.
        run: |
          chmod +x tcc-bin/tcc-linux-x86_64
          cp tcc-bin/libtcc1-linux-x86_64.a tcc-bin/libtcc1.a
          cp -r dep/tcc/include tcc-bin/include
      - name: Build sqlite3 with tcc
        run: |
          mkdir -p out
          tcc-bin/tcc-linux-x86_64 -B"$PWD"/tcc-bin -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 \
            dep/sqlite3/sqlite3.c -lm -o out/libsqlite3-tcc-linux-x86_64.so
      - name: Build zlib with tcc
        run: |
          tcc-bin/tcc-linux-x86_64 -B"$PWD"/tcc-bin -shared -fPIC -O2 -include unistd.h \
            dep/zlib/*.c -o out/libz-tcc-linux-x86_64.so
      - name: Build LuaJIT with tcc (KNOWN BROKEN — see job-level comment above; wired in for real, not faked)
        # This step is expected to fail at `host/buildvm.o` with
        # `lj_def.h:322: error: "missing defines for your compiler"` until
        # either LuaJIT's lj_def.h gains a __TINYC__ branch or tcc gains
        # __GNUC__-compatible builtins. Left unconditional (no
        # continue-on-error) so the job accurately reports red until that
        # substrate gap is closed — see TODO.md.
        run: |
          make -C dep/luajit/src \
            CC="$GITHUB_WORKSPACE/tcc-bin/tcc-linux-x86_64 -B$GITHUB_WORKSPACE/tcc-bin" \
            XCFLAGS="-DLUAJIT_ENABLE_GC64"
          mkdir -p out
          cp dep/luajit/src/luajit out/luajit-tcc-linux-x86_64
      - name: Build libressl with tcc (--disable-asm; UNVERIFIED — see comment above the job)
        run: |
          cp -rp dep/libressl /tmp/build-libressl-tcc
          cd /tmp/build-libressl-tcc
          CC="$GITHUB_WORKSPACE/tcc-bin/tcc-linux-x86_64 -B$GITHUB_WORKSPACE/tcc-bin" \
            ./configure --disable-tests --disable-asm
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-built-deps-linux-x86_64
          path: out/
          retention-days: 1

  tcc-commit:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - tcc-bootstrap-linux-x86_64
      - tcc-bootstrap-linux-aarch64
      - tcc-bootstrap-macos-arm64
      - tcc-bootstrap-windows-x86_64
      - tcc-bootstrap-windows-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tcc-*
          merge-multiple: true
      - name: Copy tcc binaries and commit
        run: |
          mkdir -p bin
          cp artifacts/tcc-linux-x86_64      bin/tcc-linux-x86_64
          cp artifacts/tcc-linux-aarch64     bin/tcc-linux-aarch64
          cp artifacts/tcc-macos-aarch64     bin/tcc-macos-aarch64
          cp artifacts/tcc-windows-x86_64.exe bin/tcc-windows-x86_64.exe
          cp artifacts/tcc-windows-x86.exe    bin/tcc-windows-x86.exe
          chmod +x bin/tcc-linux-x86_64 bin/tcc-linux-aarch64 bin/tcc-macos-aarch64
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/tcc-*
          git diff --cached --quiet || \
            git commit -m "chore(bin): update vendored tcc binaries"
          git push

  # ── Commit all artifacts back to the repo ─────────────────────────────────

  commit:
    needs:
      - luajit-linux-x86_64
      - luajit-linux-aarch64
      - luajit-macos-arm64
      - luajit-windows-x86_64
      - luajit-windows-x86
      - sqlite3-linux-x86_64
      - sqlite3-linux-aarch64
      - sqlite3-macos-arm64
      - sqlite3-windows-x86_64
      - sqlite3-windows-x86
      - zlib-linux-x86_64
      - zlib-linux-aarch64
      - zlib-macos-arm64
      - zlib-windows-x86_64
      - zlib-windows-x86
      - libressl-linux-x86_64
      - wepoll-windows-x86_64
      - wepoll-windows-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Copy artifacts and commit
        run: |
          mkdir -p bin dep/sqlite3 dep/zlib dep/wepoll dep/libressl/linux-x86_64

          # luajit/sqlite3/zlib/libressl build jobs are skipped (no artifact
          # produced) when their dep/X/VERSION pin already matches
          # dep/X/VENDORED_VERSION. Only copy + touch the vendored files when
          # the corresponding artifact was actually produced this run.
          copy_if_present() {
            src="artifacts/$1"
            dst="$2"
            if [ -e "$src" ]; then
              cp "$src" "$dst"
            fi
          }

          copy_if_present luajit                       bin/luajit-bin
          copy_if_present luajit-aarch64                bin/luajit-aarch64-bin
          copy_if_present luajit-macos-aarch64          bin/luajit-macos-aarch64
          copy_if_present luajit.exe                    bin/luajit.exe
          copy_if_present luajit32.exe                  bin/luajit32.exe
          copy_if_present ld-musl-x86_64.so.1           bin/ld-musl-x86_64.so.1
          copy_if_present ld-musl-aarch64.so.1          bin/ld-musl-aarch64.so.1

          copy_if_present libsqlite3-linux-x86_64.so   dep/sqlite3/
          copy_if_present libsqlite3-linux-aarch64.so  dep/sqlite3/
          copy_if_present libsqlite3-macos-arm64.dylib dep/sqlite3/
          copy_if_present sqlite.dll                   dep/sqlite3/sqlite3-x64.dll
          copy_if_present sqlite-x86.dll               dep/sqlite3/sqlite3-x86.dll

          copy_if_present libz-linux-x86_64.so         dep/zlib/
          copy_if_present libz-linux-aarch64.so        dep/zlib/
          copy_if_present libz-macos-arm64.dylib       dep/zlib/
          copy_if_present zlib.dll                     dep/zlib/zlib-x64.dll
          copy_if_present zlib-x86.dll                 dep/zlib/zlib-x86.dll

          copy_if_present wepoll-x64.dll                dep/wepoll/
          copy_if_present wepoll-x86.dll                dep/wepoll/

          copy_if_present libcrypto.so.57              dep/libressl/linux-x86_64/
          copy_if_present libssl.so.60                 dep/libressl/linux-x86_64/
          copy_if_present libtls.so.33                 dep/libressl/linux-x86_64/
          if [ -e dep/libressl/linux-x86_64/libcrypto.so.57 ]; then
            ln -sf libcrypto.so.57 dep/libressl/linux-x86_64/libcrypto.so
            ln -sf libssl.so.60    dep/libressl/linux-x86_64/libssl.so
            ln -sf libtls.so.33    dep/libressl/linux-x86_64/libtls.so
          fi

          # Sync the vendored-version markers to the pins. A no-op when the
          # build was skipped (they already matched); reflects the freshly
          # built version when it wasn't.
          cp dep/sqlite3/VERSION  dep/sqlite3/VENDORED_VERSION
          cp dep/zlib/VERSION     dep/zlib/VENDORED_VERSION
          cp dep/libressl/VERSION dep/libressl/VENDORED_VERSION
          cp dep/luajit/VERSION   dep/luajit/VENDORED_VERSION
          cp dep/wepoll/VERSION   dep/wepoll/VENDORED_VERSION

          chmod_if_present() {
            [ -e "$1" ] && chmod +x "$1"
          }
          for f in bin/luajit-bin bin/luajit-aarch64-bin bin/luajit-macos-aarch64 \
                   bin/luajit.exe bin/luajit32.exe \
                   bin/ld-musl-x86_64.so.1 bin/ld-musl-aarch64.so.1; do
            chmod_if_present "$f"
          done
          if [ -e dep/libressl/linux-x86_64/libcrypto.so.57 ]; then
            chmod +x dep/libressl/linux-x86_64/libcrypto.so.57 \
                     dep/libressl/linux-x86_64/libssl.so.60 \
                     dep/libressl/linux-x86_64/libtls.so.33
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/ dep/
          git diff --cached --quiet || \
            git commit -m "chore(bin): update vendored LuaJIT, sqlite3, zlib, libressl, and wepoll binaries"
          git push

