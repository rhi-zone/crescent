name: Build vendored binaries

on:
  workflow_dispatch:
    inputs:
      luajit_ref:
        description: "LuaJIT git ref (branch/tag/SHA)"
        default: "v2.1"
        required: false
  push:
    paths:
      - "dep/sqlite3/**"
      - "dep/zlib/**"
      - "dep/wepoll/**"

jobs:
  # ── LuaJIT ────────────────────────────────────────────────────────────────

  luajit-linux-x86_64:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base git
      - name: Clone LuaJIT
        run: git clone --depth 1 --branch ${{ inputs.luajit_ref || 'v2.1' }} https://github.com/LuaJIT/LuaJIT /tmp/luajit
      - name: Build
        run: |
          make -C /tmp/luajit/src \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            LDFLAGS="-Wl,-E -static-libgcc"
          strip --strip-debug /tmp/luajit/src/luajit
          mkdir -p out
          cp /tmp/luajit/src/luajit out/luajit
          cp /lib/ld-musl-x86_64.so.1 out/ld-musl-x86_64.so.1
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-x86_64
          path: out/

  luajit-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base git &&
            git clone --depth 1 --branch ${{ inputs.luajit_ref || 'v2.1' }} https://github.com/LuaJIT/LuaJIT /tmp/luajit &&
            make -C /tmp/luajit/src XCFLAGS='-DLUAJIT_ENABLE_GC64' LDFLAGS='-Wl,-E -static-libgcc' &&
            strip --strip-debug /tmp/luajit/src/luajit &&
            mkdir -p /work/out &&
            cp /tmp/luajit/src/luajit /work/out/luajit-aarch64 &&
            cp /lib/ld-musl-aarch64.so.1 /work/out/ld-musl-aarch64.so.1
          "
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-aarch64
          path: out/

  luajit-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Clone LuaJIT
        run: git clone --depth 1 --branch ${{ inputs.luajit_ref || 'v2.1' }} https://github.com/LuaJIT/LuaJIT /tmp/luajit
      - name: Build
        run: |
          make -C /tmp/luajit/src \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            LDFLAGS="-Wl,-export_dynamic"
          strip /tmp/luajit/src/luajit
          mkdir -p out
          cp /tmp/luajit/src/luajit out/luajit-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-macos-arm64
          path: out/

  luajit-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LuaJIT/LuaJIT
          ref: ${{ inputs.luajit_ref || 'v2.1' }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd /d "%GITHUB_WORKSPACE%\src"
          msvcbuild.bat
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "src\luajit.exe" "out\luajit.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86_64
          path: out/

  luajit-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LuaJIT/LuaJIT
          ref: ${{ inputs.luajit_ref || 'v2.1' }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x86)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cd /d "%GITHUB_WORKSPACE%\src"
          msvcbuild.bat
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "src\luajit.exe" "out\luajit32.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86
          path: out/

  # ── sqlite3 ───────────────────────────────────────────────────────────────

  sqlite3-linux-x86_64:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        run: |
          mkdir -p out
          gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o out/libsqlite3-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-linux-x86_64
          path: out/

  sqlite3-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            mkdir -p /work/out &&
            gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o /work/out/libsqlite3-linux-aarch64.so
          "
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-linux-aarch64
          path: out/

  sqlite3-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          clang -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o out/libsqlite3-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-macos-arm64
          path: out/

  sqlite3-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD /DSQLITE_ENABLE_FTS5 dep\sqlite3\sqlite3.c /Fe:out\sqlite.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-windows-x86_64
          path: out/

  sqlite3-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD dep\sqlite3\sqlite3.c /Fe:out\sqlite-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-windows-x86
          path: out/

  # ── zlib ──────────────────────────────────────────────────────────────────

  zlib-linux-x86_64:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        run: |
          mkdir -p out
          gcc -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o out/libz-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-x86_64
          path: out/

  zlib-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            mkdir -p /work/out &&
            gcc -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o /work/out/libz-linux-aarch64.so
          "
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-aarch64
          path: out/

  zlib-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          clang -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o out/libz-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-macos-arm64
          path: out/

  zlib-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD dep\zlib\adler32.c dep\zlib\compress.c dep\zlib\crc32.c dep\zlib\deflate.c dep\zlib\gzclose.c dep\zlib\gzlib.c dep\zlib\gzread.c dep\zlib\gzwrite.c dep\zlib\infback.c dep\zlib\inffast.c dep\zlib\inflate.c dep\zlib\inftrees.c dep\zlib\trees.c dep\zlib\uncompr.c dep\zlib\zutil.c /Fe:out\zlib.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-windows-x86_64
          path: out/

  zlib-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD dep\zlib\adler32.c dep\zlib\compress.c dep\zlib\crc32.c dep\zlib\deflate.c dep\zlib\gzclose.c dep\zlib\gzlib.c dep\zlib\gzread.c dep\zlib\gzwrite.c dep\zlib\infback.c dep\zlib\inffast.c dep\zlib\inflate.c dep\zlib\inftrees.c dep\zlib\trees.c dep\zlib\uncompr.c dep\zlib\zutil.c /Fe:out\zlib-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-windows-x86
          path: out/

  # ── wepoll ────────────────────────────────────────────────────────────────

  wepoll-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD /DWEPOLL_EXPORT=__declspec(dllexport) dep\wepoll\wepoll.c /Fe:out\wepoll-x64.dll /link ws2_32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: wepoll-windows-x86_64
          path: out/

  wepoll-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD /DWEPOLL_EXPORT=__declspec(dllexport) dep\wepoll\wepoll.c /Fe:out\wepoll-x86.dll /link ws2_32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: wepoll-windows-x86
          path: out/

  # ── Commit all artifacts back to the repo ─────────────────────────────────

  commit:
    needs:
      - luajit-linux-x86_64
      - luajit-linux-aarch64
      - luajit-macos-arm64
      - luajit-windows-x86_64
      - luajit-windows-x86
      - sqlite3-linux-x86_64
      - sqlite3-linux-aarch64
      - sqlite3-macos-arm64
      - sqlite3-windows-x86_64
      - sqlite3-windows-x86
      - zlib-linux-x86_64
      - zlib-linux-aarch64
      - zlib-macos-arm64
      - zlib-windows-x86_64
      - zlib-windows-x86
      - wepoll-windows-x86_64
      - wepoll-windows-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Copy artifacts and commit
        run: |
          mkdir -p bin dep/sqlite3 dep/zlib dep/wepoll
          cp artifacts/luajit                          bin/luajit-bin
          cp artifacts/luajit-aarch64                  bin/luajit-aarch64-bin
          cp artifacts/luajit-macos-aarch64            bin/luajit-macos-aarch64
          cp artifacts/luajit.exe                      bin/luajit.exe
          cp artifacts/luajit32.exe                    bin/luajit32.exe
          cp artifacts/ld-musl-x86_64.so.1             bin/
          cp artifacts/ld-musl-aarch64.so.1            bin/
          cp artifacts/libsqlite3-linux-x86_64.so      dep/sqlite3/
          cp artifacts/libsqlite3-linux-aarch64.so     dep/sqlite3/
          cp artifacts/libsqlite3-macos-arm64.dylib    dep/sqlite3/
          cp artifacts/sqlite.dll                      dep/sqlite3/sqlite3-x64.dll
          cp artifacts/sqlite-x86.dll                  dep/sqlite3/sqlite3-x86.dll
          cp artifacts/libz-linux-x86_64.so           dep/zlib/
          cp artifacts/libz-linux-aarch64.so          dep/zlib/
          cp artifacts/libz-macos-arm64.dylib         dep/zlib/
          cp artifacts/zlib.dll                       dep/zlib/zlib-x64.dll
          cp artifacts/zlib-x86.dll                   dep/zlib/zlib-x86.dll
          cp artifacts/wepoll-x64.dll                 dep/wepoll/
          cp artifacts/wepoll-x86.dll                 dep/wepoll/
          chmod +x bin/luajit bin/luajit-aarch64 \
                   bin/luajit-bin bin/luajit-aarch64-bin bin/luajit-macos-aarch64 \
                   bin/luajit.exe bin/luajit32.exe \
                   bin/ld-musl-x86_64.so.1 bin/ld-musl-aarch64.so.1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/ dep/
          git diff --cached --quiet || \
            git commit -m "chore(bin): update vendored LuaJIT, sqlite3, zlib, and wepoll binaries"
          git push
