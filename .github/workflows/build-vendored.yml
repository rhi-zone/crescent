name: Build vendored binaries

on:
  workflow_dispatch: {}
  push:
    paths:
      - "dep/sqlite3/**"
      - "dep/zlib/**"
      - "dep/wepoll/**"
      - "dep/libressl/**"
      - "dep/luajit/**"

jobs:
  # ── Version pinning + content-hash verification ─────────────────────────────
  # dep/X/VERSION is the pin: the version this workflow should build. Compared
  # against dep/X/VENDORED_VERSION, the marker the commit job writes alongside
  # the binaries it commits, recording what's currently vendored. When they
  # match, the corresponding build jobs below skip their (expensive)
  # build+upload steps entirely.
  #
  # VERSION alone only proves someone typed the right version string — it
  # does not prove the committed dep/X source tree still matches that version
  # byte-for-byte. dep/X/SOURCE_SHA256 (tooling/scripts/vendor-verify.sh)
  # closes that gap: a manifest hash over each dep's pinned source files,
  # checked here on every run. A mismatch fails this job hard, which in turn
  # blocks every build job below via `needs: version-check` — a source-tree
  # edit that silently drifts from what's supposedly pinned can't reach a
  # build or a commit undetected.

  version-check:
    runs-on: ubuntu-latest
    outputs:
      sqlite3_skip: ${{ steps.check.outputs.sqlite3_skip }}
      zlib_skip: ${{ steps.check.outputs.zlib_skip }}
      libressl_skip: ${{ steps.check.outputs.libressl_skip }}
      luajit_skip: ${{ steps.check.outputs.luajit_skip }}
      wepoll_skip: ${{ steps.check.outputs.wepoll_skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored source content hashes
        # tcc is intentionally NOT included here — see build-tcc.yml's
        # header comment for why sharing this step with tcc's own verify
        # was itself a bug (a tcc-only hash mismatch failed this whole job,
        # blocking every unrelated dep build below via `needs:
        # version-check`). tcc has its own version-check in build-tcc.yml.
        run: tooling/scripts/vendor-verify.sh verify sqlite3 zlib libressl wepoll luajit
      - name: Compare pinned VERSION to vendored VERSION per dep
        id: check
        run: |
          check_dep() {
            dep="$1"
            pinned="$(cat "dep/$dep/VERSION" 2>/dev/null || true)"
            vendored="$(cat "dep/$dep/VENDORED_VERSION" 2>/dev/null || true)"
            if [ -n "$pinned" ] && [ "$pinned" = "$vendored" ]; then
              echo "Skipping $dep: pinned VERSION ($pinned) already vendored"
              echo "${dep}_skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Building $dep: pinned VERSION ($pinned) != vendored ($vendored)"
              echo "${dep}_skip=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_dep sqlite3
          check_dep zlib
          check_dep libressl
          check_dep luajit
          check_dep wepoll

  # ── LuaJIT ────────────────────────────────────────────────────────────────

  luajit-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        # Built from the vendored dep/luajit/ source tree (no upstream
        # fetch): dep/luajit/VERSION pins the commit that source was
        # vendored from, and version-check verified its content hash.
        run: |
          make -C dep/luajit/src \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            LDFLAGS="-Wl,-E -static-libgcc"
          strip --strip-debug dep/luajit/src/luajit
          mkdir -p out
          cp dep/luajit/src/luajit out/luajit
          cp /lib/ld-musl-x86_64.so.1 out/ld-musl-x86_64.so.1
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-x86_64
          path: out/
          retention-days: 1

  luajit-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            make -C dep/luajit/src XCFLAGS='-DLUAJIT_ENABLE_GC64' LDFLAGS='-Wl,-E -static-libgcc' &&
            strip --strip-debug dep/luajit/src/luajit &&
            mkdir -p /work/out &&
            cp dep/luajit/src/luajit /work/out/luajit-aarch64 &&
            cp /lib/ld-musl-aarch64.so.1 /work/out/ld-musl-aarch64.so.1
          "
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-aarch64
          path: out/
          retention-days: 1

  luajit-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make -C dep/luajit/src \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            LDFLAGS="-Wl,-export_dynamic"
          strip dep/luajit/src/luajit
          mkdir -p out
          cp dep/luajit/src/luajit out/luajit-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-macos-arm64
          path: out/
          retention-days: 1

  luajit-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cd /d "%GITHUB_WORKSPACE%\dep\luajit\src"
          msvcbuild.bat
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "dep\luajit\src\luajit.exe" "out\luajit.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86_64
          path: out/
          retention-days: 1

  luajit-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.luajit_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          cd /d "%GITHUB_WORKSPACE%\dep\luajit\src"
          msvcbuild.bat
      - name: Copy artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item "dep\luajit\src\luajit.exe" "out\luajit32.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86
          path: out/
          retention-days: 1

  # ── sqlite3 ───────────────────────────────────────────────────────────────

  sqlite3-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        run: |
          mkdir -p out
          gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o out/libsqlite3-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-linux-x86_64
          path: out/
          retention-days: 1

  sqlite3-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            mkdir -p /work/out &&
            gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o /work/out/libsqlite3-linux-aarch64.so
          "
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-linux-aarch64
          path: out/
          retention-days: 1

  sqlite3-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          clang -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 dep/sqlite3/sqlite3.c -o out/libsqlite3-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-macos-arm64
          path: out/
          retention-days: 1

  sqlite3-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD /DSQLITE_ENABLE_FTS5 dep\sqlite3\sqlite3.c /Fe:out\sqlite.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-windows-x86_64
          path: out/
          retention-days: 1

  sqlite3-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.sqlite3_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD dep\sqlite3\sqlite3.c /Fe:out\sqlite-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite3-windows-x86
          path: out/
          retention-days: 1

  # ── zlib ──────────────────────────────────────────────────────────────────

  zlib-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base
      - name: Build
        run: |
          mkdir -p out
          gcc -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o out/libz-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-x86_64
          path: out/
          retention-days: 1

  zlib-linux-aarch64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest sh -c "
            apk add --no-cache build-base &&
            mkdir -p /work/out &&
            gcc -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o /work/out/libz-linux-aarch64.so
          "
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-linux-aarch64
          path: out/
          retention-days: 1

  zlib-macos-arm64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          clang -shared -fPIC -O2 -include unistd.h dep/zlib/*.c -o out/libz-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-macos-arm64
          path: out/
          retention-days: 1

  zlib-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD dep\zlib\adler32.c dep\zlib\compress.c dep\zlib\crc32.c dep\zlib\deflate.c dep\zlib\gzclose.c dep\zlib\gzlib.c dep\zlib\gzread.c dep\zlib\gzwrite.c dep\zlib\infback.c dep\zlib\inffast.c dep\zlib\inflate.c dep\zlib\inftrees.c dep\zlib\trees.c dep\zlib\uncompr.c dep\zlib\zutil.c /Fe:out\zlib.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-windows-x86_64
          path: out/
          retention-days: 1

  zlib-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.zlib_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD dep\zlib\adler32.c dep\zlib\compress.c dep\zlib\crc32.c dep\zlib\deflate.c dep\zlib\gzclose.c dep\zlib\gzlib.c dep\zlib\gzread.c dep\zlib\gzwrite.c dep\zlib\infback.c dep\zlib\inffast.c dep\zlib\inflate.c dep\zlib\inftrees.c dep\zlib\trees.c dep\zlib\uncompr.c dep\zlib\zutil.c /Fe:out\zlib-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zlib-windows-x86
          path: out/
          retention-days: 1

  # ── libressl (libtls/libssl/libcrypto) ─────────────────────────────────────

  libressl-linux-x86_64:
    needs: version-check
    if: needs.version-check.outputs.libressl_skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache build-base perl patchelf
      - name: Build
        run: |
          cp -rp dep/libressl /tmp/build-libressl
          cd /tmp/build-libressl
          LDFLAGS='-Wl,-rpath,\$$ORIGIN' ./configure --disable-tests
          make -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE"/out
          cp crypto/.libs/libcrypto.so.*.* "$GITHUB_WORKSPACE"/out/libcrypto.so.57
          cp ssl/.libs/libssl.so.*.*       "$GITHUB_WORKSPACE"/out/libssl.so.60
          cp tls/.libs/libtls.so.*.*       "$GITHUB_WORKSPACE"/out/libtls.so.33
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libcrypto.so.57
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libssl.so.60
          patchelf --set-rpath '$ORIGIN' "$GITHUB_WORKSPACE"/out/libtls.so.33
          # Note: the unversioned .so symlinks (libtls.so -> libtls.so.33, etc.)
          # are created by the commit job, not uploaded as artifacts here —
          # actions/upload-artifact's zip packaging is not relied on to
          # round-trip symlinks correctly.
      - uses: actions/upload-artifact@v4
        with:
          name: libressl-linux-x86_64
          path: out/
          retention-days: 1

  # ── wepoll ────────────────────────────────────────────────────────────────

  wepoll-windows-x86_64:
    needs: version-check
    if: needs.version-check.outputs.wepoll_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir out
          cl /O2 /LD /DWEPOLL_EXPORT=__declspec(dllexport) dep\wepoll\wepoll.c /Fe:out\wepoll-x64.dll /link ws2_32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: wepoll-windows-x86_64
          path: out/
          retention-days: 1

  wepoll-windows-x86:
    needs: version-check
    if: needs.version-check.outputs.wepoll_skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          mkdir out
          cl /O2 /LD /DWEPOLL_EXPORT=__declspec(dllexport) dep\wepoll\wepoll.c /Fe:out\wepoll-x86.dll /link ws2_32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: wepoll-windows-x86
          path: out/
          retention-days: 1

  # ── TinyCC (tcc) — moved to build-tcc.yml (2026-08-21) ─────────────────────
  #
  # tcc's build+verify+commit pipeline now lives entirely in its own
  # workflow file, build-tcc.yml — see that file's header comment for why
  # (sharing this file's `version-check` job with tcc's verify step meant a
  # tcc-only SOURCE_SHA256 mismatch failed this whole job and blocked every
  # unrelated dep build below, confirmed happening in practice on
  # 2026-08-21). tcc-bootstrap-*, tcc-build-deps-linux-x86_64, and
  # tcc-commit all moved there unchanged. Nothing tcc-related remains in
  # this file.

  # ── Commit all artifacts back to the repo ─────────────────────────────────

  commit:
    # Default `needs:` semantics skip a job if ANY needed job was skipped,
    # not just failed — and the per-dep build jobs below are individually
    # skip-gated on their own VERSION==VENDORED_VERSION check (see
    # version-check above), so on any run where at least one dep is
    # unchanged (nearly every run — all six pins moving in lockstep in one
    # PR is rare), a needed job is skipped and this job silently never ran,
    # never committing the binaries that DID successfully build. Confirmed
    # happening in practice: the 2026-08-21 luajit-only bump built clean on
    # every luajit-* job but never landed, because wepoll-windows-x86/
    # x86_64 were (correctly) skipped as unchanged and dragged this job
    # down with them. Explicit condition: run unless the workflow was
    # cancelled or something in `needs` actually failed — skipped is fine,
    # the copy_if_present() logic below already only copies artifacts that
    # were actually produced this run.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs:
      - luajit-linux-x86_64
      - luajit-linux-aarch64
      - luajit-macos-arm64
      - luajit-windows-x86_64
      - luajit-windows-x86
      - sqlite3-linux-x86_64
      - sqlite3-linux-aarch64
      - sqlite3-macos-arm64
      - sqlite3-windows-x86_64
      - sqlite3-windows-x86
      - zlib-linux-x86_64
      - zlib-linux-aarch64
      - zlib-macos-arm64
      - zlib-windows-x86_64
      - zlib-windows-x86
      - libressl-linux-x86_64
      - wepoll-windows-x86_64
      - wepoll-windows-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Copy artifacts and commit
        run: |
          mkdir -p bin dep/sqlite3 dep/zlib dep/wepoll dep/libressl/linux-x86_64

          # luajit/sqlite3/zlib/libressl build jobs are skipped (no artifact
          # produced) when their dep/X/VERSION pin already matches
          # dep/X/VENDORED_VERSION. Only copy + touch the vendored files when
          # the corresponding artifact was actually produced this run.
          copy_if_present() {
            src="artifacts/$1"
            dst="$2"
            if [ -e "$src" ]; then
              cp "$src" "$dst"
            fi
          }

          copy_if_present luajit                       bin/luajit-bin
          copy_if_present luajit-aarch64                bin/luajit-aarch64-bin
          copy_if_present luajit-macos-aarch64          bin/luajit-macos-aarch64
          copy_if_present luajit.exe                    bin/luajit.exe
          copy_if_present luajit32.exe                  bin/luajit32.exe
          copy_if_present ld-musl-x86_64.so.1           bin/ld-musl-x86_64.so.1
          copy_if_present ld-musl-aarch64.so.1          bin/ld-musl-aarch64.so.1

          copy_if_present libsqlite3-linux-x86_64.so   dep/sqlite3/
          copy_if_present libsqlite3-linux-aarch64.so  dep/sqlite3/
          copy_if_present libsqlite3-macos-arm64.dylib dep/sqlite3/
          copy_if_present sqlite.dll                   dep/sqlite3/sqlite3-x64.dll
          copy_if_present sqlite-x86.dll               dep/sqlite3/sqlite3-x86.dll

          copy_if_present libz-linux-x86_64.so         dep/zlib/
          copy_if_present libz-linux-aarch64.so        dep/zlib/
          copy_if_present libz-macos-arm64.dylib       dep/zlib/
          copy_if_present zlib.dll                     dep/zlib/zlib-x64.dll
          copy_if_present zlib-x86.dll                 dep/zlib/zlib-x86.dll

          copy_if_present wepoll-x64.dll                dep/wepoll/
          copy_if_present wepoll-x86.dll                dep/wepoll/

          copy_if_present libcrypto.so.57              dep/libressl/linux-x86_64/
          copy_if_present libssl.so.60                 dep/libressl/linux-x86_64/
          copy_if_present libtls.so.33                 dep/libressl/linux-x86_64/
          if [ -e dep/libressl/linux-x86_64/libcrypto.so.57 ]; then
            ln -sf libcrypto.so.57 dep/libressl/linux-x86_64/libcrypto.so
            ln -sf libssl.so.60    dep/libressl/linux-x86_64/libssl.so
            ln -sf libtls.so.33    dep/libressl/linux-x86_64/libtls.so
          fi

          # Sync the vendored-version markers to the pins. A no-op when the
          # build was skipped (they already matched); reflects the freshly
          # built version when it wasn't.
          cp dep/sqlite3/VERSION  dep/sqlite3/VENDORED_VERSION
          cp dep/zlib/VERSION     dep/zlib/VENDORED_VERSION
          cp dep/libressl/VERSION dep/libressl/VENDORED_VERSION
          cp dep/luajit/VERSION   dep/luajit/VENDORED_VERSION
          cp dep/wepoll/VERSION   dep/wepoll/VENDORED_VERSION

          chmod_if_present() {
            [ -e "$1" ] && chmod +x "$1"
          }
          for f in bin/luajit-bin bin/luajit-aarch64-bin bin/luajit-macos-aarch64 \
                   bin/luajit.exe bin/luajit32.exe \
                   bin/ld-musl-x86_64.so.1 bin/ld-musl-aarch64.so.1; do
            chmod_if_present "$f"
          done
          if [ -e dep/libressl/linux-x86_64/libcrypto.so.57 ]; then
            chmod +x dep/libressl/linux-x86_64/libcrypto.so.57 \
                     dep/libressl/linux-x86_64/libssl.so.60 \
                     dep/libressl/linux-x86_64/libtls.so.33
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/ dep/
          git diff --cached --quiet || \
            git commit -m "chore(bin): update vendored LuaJIT, sqlite3, zlib, libressl, and wepoll binaries"
          git push

