name: Build vendored sqlite3

on:
  workflow_dispatch:
  push:
    paths:
      - "dep/sqlite3/**"

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache gcc musl-dev
      - name: Build
        run: |
          gcc -shared -fPIC -O2 \
            -o dep/libsqlite3-linux-x86_64.so \
            dep/sqlite3/sqlite3.c
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dep/libsqlite3-linux-x86_64.so

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache gcc musl-dev
      - name: Build
        run: |
          gcc -shared -fPIC -O2 \
            -o dep/libsqlite3-linux-aarch64.so \
            dep/sqlite3/sqlite3.c
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dep/libsqlite3-linux-aarch64.so

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          clang -shared -fPIC -O2 \
            -o dep/libsqlite3-macos-arm64.dylib \
            dep/sqlite3/sqlite3.c
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dep/libsqlite3-macos-arm64.dylib

  macos-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          clang -shared -fPIC -O2 \
            -o dep/libsqlite3-macos-x86_64.dylib \
            dep/sqlite3/sqlite3.c
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dep/libsqlite3-macos-x86_64.dylib

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /LD /O2 /Fe:dep\sqlite.dll dep\sqlite3\sqlite3.c
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dep/sqlite.dll

  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x86)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cl /LD /O2 /Fe:dep\sqlite-x86.dll dep\sqlite3\sqlite3.c
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: dep/sqlite-x86.dll

  commit:
    needs:
      - linux-x86_64
      - linux-aarch64
      - macos-arm64
      - macos-x86_64
      - windows-x86_64
      - windows-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dep/
      - uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: dep/
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dep/
      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: dep/
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dep/
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86
          path: dep/
      - name: Commit and push
        run: |
          git config user.name "$(git log -1 --format='%an')"
          git config user.email "$(git log -1 --format='%ae')"
          git add dep/libsqlite3-linux-x86_64.so
          git add dep/libsqlite3-linux-aarch64.so
          git add dep/libsqlite3-macos-arm64.dylib
          git add dep/libsqlite3-macos-x86_64.dylib
          git add dep/sqlite.dll
          git add dep/sqlite-x86.dll
          git diff --cached --quiet || \
            git commit -m "chore(dep): update vendored sqlite3 platform binaries"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
