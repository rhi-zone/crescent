<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crescent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="header-title">Crescent</h1>
  </header>
  <div class="search-bar">
    <input type="text" id="search" placeholder="Search cards..." autocomplete="off">
  </div>
  <main class="card-grid" id="card-grid">
    <!-- Cards populated by app.js -->
  </main>
  <div class="empty-state" id="empty-state" hidden>
    <p>No cards found.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
