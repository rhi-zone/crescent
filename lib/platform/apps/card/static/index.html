<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <template id="message-template">
    <div class="message">
      <div class="message__content"></div>
    </div>
  </template>

  <div class="greeting-bar" hidden>
    <button class="greeting-bar__button" data-action="greeting-prev">&lt;</button>
    <span class="greeting-bar__label"></span>
    <button class="greeting-bar__button" data-action="greeting-next">&gt;</button>
  </div>

  <div class="message-list" id="message-list"></div>

  <div class="loading-indicator" id="loading">
    <span class="loading-indicator__text">...</span>
  </div>

  <div class="input-row">
    <textarea class="input-row__textarea" id="input" rows="1" placeholder="Type a message..."></textarea>
    <button class="input-row__button input-row__button--send" id="btn-send">Send</button>
    <button class="input-row__button input-row__button--regen" id="btn-regen">Regen</button>
    <button class="input-row__button input-row__button--continue" id="btn-continue">Continue</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
