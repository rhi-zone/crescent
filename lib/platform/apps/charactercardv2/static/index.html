<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Card v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <template id="message-template">
    <div class="message">
      <img class="message__avatar" src="/api/avatar" alt="" hidden>
      <div class="message__speaker" hidden></div>
      <div class="message__content"></div>
      <div class="message__footer">
        <div class="message__swipe" hidden>
          <button class="message__swipe-button" data-dir="prev" aria-label="Previous message">&lt;</button>
          <span class="message__swipe-label"></span>
          <button class="message__swipe-button" data-dir="next" aria-label="Next message">&gt;</button>
        </div>
        <div class="message__actions">
          <button class="message__action-button" data-action="edit">Edit</button>
          <button class="message__action-button message__action-button--delete" data-action="delete">Delete</button>
        </div>
      </div>
    </div>
  </template>

  <button class="session-toggle" id="btn-sessions" title="Chats" aria-label="Open chats panel">&#9776;</button>

  <div class="session-panel" id="session-panel" role="dialog" aria-modal="true" aria-labelledby="session-panel-title" hidden>
    <div class="session-panel__header">
      <span class="session-panel__title" id="session-panel-title">Chats</span>
      <button class="session-panel__new" id="btn-new-session" title="New Chat (Ctrl+Shift+N)">+ New Chat</button>
      <button class="session-panel__close" id="btn-close-sessions" aria-label="Close chats panel">&times;</button>
    </div>
    <div class="session-panel__list" id="session-list"></div>
  </div>
  <div class="session-overlay" id="session-overlay" hidden></div>

  <div class="card-header" id="card-header">
    <div class="card-header__top">
      <img class="card-header__avatar" id="card-avatar" src="/api/avatar" alt="">
      <div class="card-header__info">
        <div class="card-header__name" id="card-header-name"></div>
      </div>
      <button class="card-header__new-card" id="btn-new-card" title="Create a new blank character card">New Card</button>
    </div>
    <div class="card-header__actions" aria-label="Card actions">
      <button class="card-header__action-btn" id="btn-card-header-edit" title="Open card editor">Edit</button>
      <a class="card-header__action-btn" id="btn-card-header-export" href="/api/card/export" download title="Download card as PNG">Export</a>
      <button class="card-header__action-btn" id="btn-card-header-export-chat" title="Export Chat (Ctrl+Shift+E)">Export Chat</button>
      <!-- TODO: fork — save as new card (requires server-side fork endpoint) -->
    </div>
  </div>

  <div class="message-list" id="message-list"></div>

  <div class="loading-indicator" id="loading" role="status" aria-live="polite">
    <span class="loading-indicator__text">...</span>
  </div>

  <div class="token-counter" id="token-counter">
    <span class="token-counter__text" id="token-count-text">0 / 4096</span>
    <div class="token-counter__bar">
      <div class="token-counter__fill" id="token-count-fill"></div>
    </div>
  </div>

  <div class="input-row">
    <textarea class="input-row__textarea" id="input" rows="3" placeholder="Type a message..."></textarea>
    <div class="input-row__actions">
      <button class="input-row__button input-row__button--send" id="btn-send" title="Send (Enter or Ctrl+Enter)">Send</button>
      <button class="input-row__button input-row__button--continue" id="btn-continue">Continue</button>
      <button class="input-row__button input-row__button--impersonate" id="btn-impersonate">Impersonate</button>
      <button class="input-row__button input-row__button--settings" id="btn-settings" title="Settings (Ctrl+Shift+S)" aria-label="Settings">&#9881;</button>
      <button class="input-row__button input-row__button--world-info" id="btn-my-lorebooks" title="My Lorebooks (Ctrl+Shift+W)" aria-label="My Lorebooks">&#128218;</button>
      <button class="input-row__button input-row__button--group" id="btn-group" title="Group Chat" aria-label="Group chat">&#128101;</button>
    </div>
  </div>

  <div class="settings-overlay" id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-panel-title" hidden>
    <div class="settings-panel" id="settings-panel">
      <div class="settings-panel__header">
        <span class="settings-panel__title" id="settings-panel-title">Generation Settings</span>
        <button class="settings-panel__close" id="settings-close" aria-label="Close settings">&times;</button>
      </div>
      <div class="settings-panel__body">
        <div class="settings-section">
          <span class="settings-section__title">Connection</span>
          <div class="settings-connection">
            <button id="btn-test-connection" class="settings-connection__btn">Test Connection</button>
            <span id="connection-result" class="connection-result" role="status" aria-live="polite"></span>
          </div>
        </div>
        <div class="settings-section">
          <span class="settings-section__title">Persona</span>
          <div class="settings-persona">
            <div class="settings-persona__row">
              <select id="persona-select" class="settings-persona__select"></select>
              <button id="persona-new" class="settings-persona__btn">New</button>
              <button id="persona-delete" class="settings-persona__btn settings-persona__btn--danger">Delete</button>
            </div>
            <label class="settings-field">
              <span class="settings-field__label">Name</span>
              <input type="text" id="persona-name" class="settings-persona__input">
            </label>
            <label class="settings-field">
              <span class="settings-field__label">Description</span>
              <textarea id="persona-description" class="settings-persona__textarea" rows="3" placeholder="Describe your persona (injected into context)..."></textarea>
            </label>
            <button id="persona-save" class="settings-persona__btn settings-persona__btn--save">Save Persona</button>
          </div>
        </div>
        <div class="settings-section">
          <span class="settings-section__title">Generation</span>
        </div>
        <label class="settings-field">
          <span class="settings-field__label">Temperature <span class="settings-field__value" id="val-temperature">0.7</span></span>
          <input type="range" id="set-temperature" min="0" max="2" step="0.05" value="0.7">
        </label>
        <label class="settings-field">
          <span class="settings-field__label">Top P <span class="settings-field__value" id="val-top_p">1.0</span></span>
          <input type="range" id="set-top_p" min="0" max="1" step="0.05" value="1.0">
        </label>
        <label class="settings-field">
          <span class="settings-field__label">Max Response Tokens</span>
          <input type="number" id="set-max_tokens" min="1" max="32768" value="512">
        </label>
        <label class="settings-field">
          <span class="settings-field__label">Frequency Penalty <span class="settings-field__value" id="val-frequency_penalty">0.0</span></span>
          <input type="range" id="set-frequency_penalty" min="0" max="2" step="0.1" value="0.0">
        </label>
        <label class="settings-field">
          <span class="settings-field__label">Presence Penalty <span class="settings-field__value" id="val-presence_penalty">0.0</span></span>
          <input type="range" id="set-presence_penalty" min="0" max="2" step="0.1" value="0.0">
        </label>
        <label class="settings-field">
          <span class="settings-field__label">Max Context</span>
          <input type="number" id="set-max_context" min="256" max="131072" value="4096">
        </label>
      </div>
      <div class="settings-panel__footer">
        <button class="settings-panel__save" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <div class="lorebook-overlay" id="my-lorebooks-overlay" role="dialog" aria-modal="true" aria-labelledby="my-lorebooks-panel-title" hidden>
    <div class="lorebook-panel lorebook-panel--wide" id="my-lorebooks-panel">
      <div class="lorebook-panel__header">
        <span class="lorebook-panel__title" id="my-lorebooks-panel-title">My Lorebooks</span>
        <button class="lorebook-panel__import" id="my-lorebooks-import" title="Import lorebook from JSON" aria-label="Import lorebook from JSON">&#128194; Import</button>
        <button class="lorebook-panel__add" id="my-lorebooks-new">+ New Lorebook</button>
        <input type="file" id="my-lorebooks-import-file" accept=".json,application/json" hidden>
        <button class="lorebook-panel__close" id="my-lorebooks-close" aria-label="Close lorebooks">&times;</button>
      </div>
      <div class="lorebook-panel__split">
        <div class="book-list" id="book-list"></div>
        <div class="book-detail" id="book-detail">
          <div class="book-detail__placeholder" id="book-detail-placeholder">
            Select a lorebook to view entries, or create a new one.
          </div>
          <div class="book-detail__header" id="book-detail-header" hidden>
            <input class="book-detail__name" id="book-detail-name" type="text">
            <button class="book-detail__rename" id="book-detail-rename">Save name</button>
            <button class="lorebook-panel__add" id="book-detail-add">+ Add Entry</button>
          </div>
          <div class="book-detail__body" id="book-detail-body" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card-edit-overlay" id="card-edit-overlay" role="dialog" aria-modal="true" aria-labelledby="card-edit-panel-title" hidden>
    <div class="card-edit-panel">
      <div class="card-edit-panel__header">
        <span class="card-edit-panel__title" id="card-edit-panel-title"></span>
        <div class="card-edit-tabs" role="tablist">
          <button class="card-edit-tab" id="tab-btn-identity" role="tab" aria-controls="tab-identity" aria-selected="true">Identity</button>
          <button class="card-edit-tab" id="tab-btn-greetings" role="tab" aria-controls="tab-greetings" aria-selected="false">Greetings</button>
          <button class="card-edit-tab" id="tab-btn-lorebook" role="tab" aria-controls="tab-lorebook" aria-selected="false">Lorebook</button>
          <button class="card-edit-tab" id="tab-btn-regex" role="tab" aria-controls="tab-regex" aria-selected="false">Regex</button>
        </div>
        <button class="card-edit-panel__close" id="card-edit-close" aria-label="Close card editor">&times;</button>
      </div>
      <div class="card-edit-panel__notice" id="card-edit-notice" hidden></div>

      <!-- Identity tab -->
      <div class="card-edit-tab-pane" id="tab-identity" role="tabpanel" aria-labelledby="tab-btn-identity">
        <div class="card-edit-panel__body">
          <label class="card-edit-field">
            <span class="card-edit-field__label">Name</span>
            <input type="text" class="card-edit-field__input" id="card-name">
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Creator</span>
            <input type="text" class="card-edit-field__input" id="card-creator">
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Version</span>
            <input type="text" class="card-edit-field__input" id="card-character_version">
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Description</span>
            <textarea class="card-edit-field__textarea" id="card-description" rows="4"></textarea>
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Personality</span>
            <textarea class="card-edit-field__textarea" id="card-personality" rows="3"></textarea>
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Scenario</span>
            <textarea class="card-edit-field__textarea" id="card-scenario" rows="3"></textarea>
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">System Prompt</span>
            <textarea class="card-edit-field__textarea" id="card-system_prompt" rows="4"></textarea>
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Post-History Instructions</span>
            <textarea class="card-edit-field__textarea" id="card-post_history_instructions" rows="3"></textarea>
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Creator Notes</span>
            <textarea class="card-edit-field__textarea" id="card-creator_notes" rows="3"></textarea>
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Tags (comma-separated)</span>
            <input type="text" class="card-edit-field__input" id="card-tags">
          </label>
          <div class="card-edit-field">
            <span class="card-edit-field__label">Author's Note</span>
            <textarea class="card-edit-field__textarea" id="an-text" rows="2" placeholder="Injected into context at the specified depth..."></textarea>
            <div class="card-edit-an-controls">
              <label class="card-edit-an-field">
                <span>Depth</span>
                <input type="number" id="an-depth" min="0" max="999" value="4" class="card-edit-an-input">
              </label>
              <label class="card-edit-an-field">
                <span>Position</span>
                <select id="an-position" class="card-edit-an-input">
                  <option value="after">After</option>
                  <option value="before">Before</option>
                </select>
              </label>
              <button class="card-edit-an-save" id="an-save">Save AN</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Greetings tab -->
      <div class="card-edit-tab-pane" id="tab-greetings" role="tabpanel" aria-labelledby="tab-btn-greetings" hidden>
        <div class="card-edit-panel__body">
          <label class="card-edit-field">
            <span class="card-edit-field__label">First Message</span>
            <textarea class="card-edit-field__textarea" id="card-first_mes" rows="4"></textarea>
          </label>
          <label class="card-edit-field">
            <span class="card-edit-field__label">Example Messages</span>
            <textarea class="card-edit-field__textarea" id="card-mes_example" rows="4"></textarea>
          </label>
          <div class="card-edit-field">
            <span class="card-edit-field__label">Alternate Greetings</span>
            <div id="card-alt-greetings-list" class="card-edit-alt-list"></div>
            <button class="card-edit-alt-add" id="card-alt-add">+ Add Greeting</button>
          </div>
        </div>
      </div>

      <!-- Lorebook tab -->
      <div class="card-edit-tab-pane" id="tab-lorebook" role="tabpanel" aria-labelledby="tab-btn-lorebook" hidden>
        <div class="card-edit-panel__header-action">
          <button class="lorebook-panel__add" id="lorebook-add">+ Add Entry</button>
        </div>
        <div class="lorebook-panel__notice" id="lorebook-notice" hidden></div>
        <div class="lorebook-panel__body" id="lorebook-list"></div>

        <div class="linked-lorebooks" id="linked-lorebooks">
          <div class="linked-lorebooks__header">
            <span class="linked-lorebooks__title">Linked Lorebooks</span>
            <button class="lorebook-panel__add" id="linked-lorebooks-add" title="Add linked lorebook (upload JSON)">+ Add Linked Lorebook</button>
            <input type="file" id="linked-lorebooks-file" accept=".json,application/json" hidden>
          </div>
          <div class="linked-lorebooks__list" id="linked-lorebooks-list"></div>
        </div>
      </div>

      <!-- Regex tab -->
      <div class="card-edit-tab-pane" id="tab-regex" role="tabpanel" aria-labelledby="tab-btn-regex" hidden>
        <div class="card-edit-panel__header-action">
          <button class="regex-panel__add" id="regex-add">+ Add Script</button>
        </div>
        <div class="regex-panel__body" id="regex-list"></div>
        <div class="regex-panel__test">
          <span class="regex-panel__test-title">Test</span>
          <input class="regex-panel__test-input" id="regex-test-find" placeholder="Pattern (find)">
          <input class="regex-panel__test-input" id="regex-test-replace" placeholder="Replacement">
          <textarea class="regex-panel__test-textarea" id="regex-test-input" rows="2" placeholder="Test input text..."></textarea>
          <button class="regex-panel__test-btn" id="regex-test-btn">Test</button>
          <div class="regex-panel__test-output" id="regex-test-output"></div>
        </div>
      </div>

      <div class="card-edit-panel__footer" id="card-edit-footer">
        <button class="card-edit-panel__reset" id="card-edit-reset">Reset to Original</button>
        <button class="card-edit-panel__save" id="card-edit-save">Save</button>
      </div>
    </div>
  </div>

  <div class="group-overlay" id="group-overlay" role="dialog" aria-modal="true" aria-labelledby="group-panel-title" hidden>
    <div class="group-panel">
      <div class="group-panel__header">
        <span class="group-panel__title" id="group-panel-title">Group Chat</span>
        <button class="group-panel__close" id="group-close" aria-label="Close group chat">&times;</button>
      </div>
      <div class="group-panel__body">
        <div class="group-toggle-row">
          <label class="group-toggle-label">
            <input type="checkbox" id="group-enabled">
            <span>Enable Group Chat</span>
          </label>
        </div>
        <div class="group-order-row">
          <label class="group-order-label">Turn Order</label>
          <select id="group-turn-order" class="group-order-select">
            <option value="round_robin">Round Robin</option>
            <option value="all">All Respond</option>
            <option value="random">Random</option>
          </select>
        </div>
        <div class="group-members">
          <span class="group-members__title">Members</span>
          <div id="group-member-list" class="group-member-list"></div>
        </div>
        <div class="group-add">
          <span class="group-add__title">Add Character</span>
          <textarea id="group-add-json" class="group-add__textarea" rows="4" placeholder="Paste card JSON here..."></textarea>
          <button id="group-add-btn" class="group-add__btn">Add to Group</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
