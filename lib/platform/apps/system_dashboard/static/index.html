<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <div id="palette">
      <input id="search" type="text" placeholder="Search system configuration..." autocomplete="off" spellcheck="false">
      <div id="results"></div>
      <div id="exec-panel" style="display:none">
        <div class="exec-label" id="exec-label">Run this in your terminal</div>
        <pre class="exec-command" id="exec-command"></pre>
        <button class="exec-copy" id="exec-copy">Copy</button>
      </div>
    </div>
    <div id="footer">
      <span id="pack-info"></span>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
