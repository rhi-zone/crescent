<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <div id="palette">
      <input id="search" type="text" placeholder="Search system configuration..." autocomplete="off" spellcheck="false">
      <div id="results"></div>
      <div id="output-panel" style="display:none">
        <div class="output-label" id="output-label"></div>
        <pre class="output-body" id="output-body"></pre>
      </div>
    </div>
    <div id="footer">
      <span id="pack-info"></span>
    </div>
  </div>
  <div id="confirm-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-dialog">
      <div id="modal-title" class="modal-title"></div>
      <p class="modal-warning">This will run a shell command.</p>
      <div class="modal-section-label">Command</div>
      <pre id="modal-command" class="cmd-preview"></pre>
      <div id="modal-caps" class="modal-caps-section" style="display:none">
        <div class="modal-section-label">Required capabilities</div>
        <div id="modal-caps-list"></div>
      </div>
      <div class="modal-buttons">
        <button id="modal-cancel" class="modal-btn modal-btn-cancel" autofocus>Cancel</button>
        <button id="modal-execute" class="modal-btn modal-btn-execute">Execute</button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
